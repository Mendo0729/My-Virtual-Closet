services:

  app:
    image: node:24-alpine
    container_name: my-virtual-closet-dev

    working_dir: /app

    command:
      - sh
      - -c
      - |
        corepack enable &&
        corepack prepare pnpm@11.4.0 --activate &&
        pnpm dev --host 0.0.0.0

    environment:
      VITE_BACKGROUND_REMOVAL_MODEL: ${BACKGROUND_REMOVAL_MODEL:-birefnet-general-lite}

    volumes:
      - ./:/app
      - node_modules:/app/node_modules

    ports:
      - "100.74.236.102:5173:5173"

    networks:
      - mvc-dev

    restart: unless-stopped

  background-removal:
    image: danielgatis/rembg:2.0.77
    container_name: my-virtual-closet-rembg

    command:
      - s
      - --host
      - 0.0.0.0
      - --port
      - "7000"
      - --threads
      - "1"
      - --no-ui

    environment:
      OMP_NUM_THREADS: "2"

    volumes:
      - rembg_models:/root/.u2net

    networks:
      - mvc-dev

    cpus: "2.0"
    mem_limit: 3g

    restart: unless-stopped

networks:

  mvc-dev:
    name: my-virtual-closet-dev
    driver: bridge

volumes:

  node_modules:
    name: my-virtual-closet-node-modules

  rembg_models:
    name: my-virtual-closet-rembg-models
